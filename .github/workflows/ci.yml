name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: platoon
          POSTGRES_USER: platoon_owner
          POSTGRES_PASSWORD: platoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platoon_owner -d platoon"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright (tests/test_mobile_layout.py only; dev-only, not in requirements.txt)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://platoon_owner:platoon@127.0.0.1:5432/platoon
        run: |
          set -e
          for f in tests/test_*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done
