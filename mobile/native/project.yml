# The Xcode project is generated from this file: `cd mobile/native && xcodegen`.
# The generated PlatoonManager.xcodeproj is committed too, so Xcode alone is
# enough to build; re-run xcodegen after editing this file.
name: PlatoonManager
options:
  bundleIdPrefix: com.platoonmanager
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 687CJND9M7
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "1.7.1"
targets:
  PlatoonManager:
    type: application
    platform: iOS
    sources:
      - PlatoonManager
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.platoonmanager.app
        PRODUCT_NAME: PlatoonManager
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PlatoonManager/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Platoon Mgr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  PlatoonManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PlatoonManagerTests
    dependencies:
      - target: PlatoonManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.platoonmanager.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PlatoonManager.app/PlatoonManager"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PlatoonManager:
    build:
      targets:
        PlatoonManager: all
        PlatoonManagerTests: [test]
    test:
      targets:
        - PlatoonManagerTests
