services:
  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      HTTPS: "true"
      # The host runs UTC. The duty day is an ORGANISATION setting stored in the
      # database (settings key org_timezone) and changed from Settings, so
      # PLATOON_TZ is only the fallback used before that row exists. TZ affects
      # nothing the database stores — every stored timestamp is written from
      # app_stamp() in Python — it only makes this container's logs readable
      # against the duty day. (It used to be described as what SQLite's
      # datetime('now','localtime') DEFAULTs follow; there is no SQLite now,
      # and the Postgres DEFAULTs run in the db container, not this one.)
      TZ: America/Chicago
      PLATOON_TZ: America/Chicago
      # Who may open /admin. Everything else the app needs comes straight out
      # of .env via env_file above (including CLERK_SECRET_KEY, which the
      # /admin gate uses to confirm the address with Clerk); this one is named
      # here as well so the default is visible without opening .env.
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-jonathon.carr5@gmail.com}
      DATABASE_URL: postgresql://platoon_app:${DB_APP_PASSWORD}@db:5432/platoon
      MIGRATION_DATABASE_URL: postgresql://platoon_owner:${DB_OWNER_PASSWORD}@db:5432/platoon
    volumes:
      - ./data:/data
    # Resolve directly against the LAN resolvers instead of inheriting the
    # host's systemd-resolved, which renegotiates with the Tailscale resolver
    # every day or so and returns EAI_AGAIN while it does. The app survives that
    # now (it caches Clerk's JWKS) but there is no reason to ride it out.
    dns:
      - 10.10.50.3
      - 10.10.50.4
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:17
    # The cluster was initdb'd as UTC, so to_char(now(), ...) in the column
    # DEFAULTs stamped five hours ahead of the duty day. Nothing on a normal
    # path reaches those DEFAULTs any more (app_stamp() is passed explicitly),
    # but a backstop that is wrong is not a backstop — pin the GUC so anything
    # that ever does fall through lands on the right day. -c timezone is the
    # knob that works on an already-initialised cluster; a TZ env var here
    # would not, the GUC is baked at initdb.
    command: postgres -c timezone=America/Chicago
    environment:
      POSTGRES_DB: platoon
      POSTGRES_USER: platoon_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platoon_owner -d platoon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
