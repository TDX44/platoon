services:
  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      HTTPS: "true"
      # The host runs UTC. The duty day is an ORGANISATION setting stored in the
      # database (settings key org_timezone) and changed from Settings, so
      # PLATOON_TZ is only the fallback used before that row exists. TZ is what
      # SQLite's datetime('now','localtime') column DEFAULTs follow, and it
      # makes container logs readable against the duty day.
      TZ: America/Chicago
      PLATOON_TZ: America/Chicago
      DATABASE_URL: postgresql://platoon_app:${DB_APP_PASSWORD}@db:5432/platoon
      MIGRATION_DATABASE_URL: postgresql://platoon_owner:${DB_OWNER_PASSWORD}@db:5432/platoon
    volumes:
      - ./data:/data
    # Resolve directly against the LAN resolvers instead of inheriting the
    # host's systemd-resolved, which renegotiates with the Tailscale resolver
    # every day or so and returns EAI_AGAIN while it does. The app survives that
    # now (it caches Clerk's JWKS) but there is no reason to ride it out.
    dns:
      - 10.10.50.3
      - 10.10.50.4
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: platoon
      POSTGRES_USER: platoon_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platoon_owner -d platoon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
